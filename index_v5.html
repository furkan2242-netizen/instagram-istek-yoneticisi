<script>
(function(){
"use strict";
var BATCH=100, KEY="ig_progress_v5";
var DATA=[], done={}, batch=0;
var summary=document.getElementById("summary"), batchTitle=document.getElementById("batchTitle"),
batchStat=document.getElementById("batchStat"), list=document.getElementById("list"),
prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn"),
resetBtn=document.getElementById("resetBtn"), errorBox=document.getElementById("error");

function fail(e){errorBox.style.display="block";errorBox.textContent="Uygulama hatası: "+(e&&e.message?e.message:e);summary.textContent="Veri yüklenemedi."}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function save(){try{localStorage.setItem(KEY,JSON.stringify({done:Object.keys(done),batch:batch}))}catch(e){}}
function load(){
  DATA=JSON.parse(document.getElementById("ig-data").textContent);
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"batch":0}');
    batch=parseInt(s.batch,10)||0;
    (s.done||[]).forEach(function(n){done[String(n)]=true});
  }catch(e){}
}
function mark(n){done[String(n)]=true;save();render()}
function render(){
  var start=batch*BATCH,end=Math.min(start+BATCH,DATA.length),items=DATA.slice(start,end),bd=0,html=[];
  items.forEach(function(x){
    var isDone=!!done[String(x.n)]; if(isDone)bd++;
    html.push('<div class="item '+(isDone?'done':'')+'"><div class="who"><span class="num">#'+x.n+'</span><strong>@'+esc(x.user)+'</strong></div><div class="actions"><a class="open" data-n="'+x.n+'" href="'+x.url+'">Instagram’da Aç</a><button disabled>'+(isDone?'✓ Profil açıldı':'Bekliyor')+'</button></div></div>');
  });
  summary.innerHTML="<b>Toplam:</b> "+DATA.length.toLocaleString("tr-TR")+" &nbsp; <b>Açılan:</b> "+Object.keys(done).length.toLocaleString("tr-TR")+" &nbsp; <b>Kalan:</b> "+(DATA.length-Object.keys(done).length).toLocaleString("tr-TR");
  batchTitle.textContent="Parti "+(batch+1)+" / "+Math.ceil(DATA.length/BATCH)+" — #"+(start+1)+"–#"+end;
  batchStat.textContent=bd+" / "+items.length+" profil açıldı";
  list.innerHTML=html.join("");
  prevBtn.disabled=batch===0; nextBtn.disabled=end>=DATA.length;
}
list.addEventListener("click",function(e){
  var a=e.target.closest("a.open[data-n]"); if(!a)return;
  var n=parseInt(a.getAttribute("data-n"),10);
  mark(n);
  /* iOS/Safari web sayfası başka bir uygulamayı 3 sn sonra kendiliğinden öne getiremez.
     Sayfa açık kalır; kullanıcı Instagram'dan geri döndüğünde işaret yeşil kalır. */
});
prevBtn.addEventListener("click",function(){if(batch>0){batch--;save();render();window.scrollTo(0,0)}});
nextBtn.addEventListener("click",function(){if((batch+1)*BATCH<DATA.length){batch++;save();render();window.scrollTo(0,0)}});
resetBtn.addEventListener("click",function(){if(confirm("İlerleme sıfırlansın mı?")){done={};batch=0;save();render()}});
try{load();render()}catch(e){fail(e)}
})();
</script>
